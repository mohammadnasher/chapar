# Requires Prometheus Operator (kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chapar-api
  namespace: chapar
  labels:
    app: chapar-api
    release: prometheus  # match your Prometheus Operator helm release label
spec:
  selector:
    matchLabels:
      app: chapar-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chapar-worker
  namespace: chapar
  labels:
    app: chapar-worker
    release: prometheus
spec:
  selector:
    matchLabels:
      app: chapar-worker
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
