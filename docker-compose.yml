services:
  # ── Application API ──────────────────────────────────────────────────────────
  chapar-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      # Serve the HTTP API only; the worker service consumes the queue.
      CHAPAR_ROLE: api
      # Apply pending migrations from a single instance (the API) on startup.
      RUN_MIGRATIONS: 'true'
      # Connection URLs must point at the compose service names (not localhost).
      # These override any host-oriented values from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-chapar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chapar}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chapar-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── BullMQ Worker (horizontally scalable) ────────────────────────────────────
  chapar-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      # Consume the queue and send notifications; no public API.
      CHAPAR_ROLE: worker
      # Workers never run migrations (the API owns that to avoid races).
      RUN_MIGRATIONS: 'false'
      # Connection URLs must point at the compose service names (not localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-chapar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chapar}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Custom templates: uncomment (with the volume below) to add/override
      # .hbs templates without rebuilding the image.
      # TEMPLATES_DIR: /templates
    # volumes:
    #   - ./templates:/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chapar-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chapar}
      POSTGRES_USER: ${POSTGRES_USER:-chapar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chapar-net
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chapar}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - chapar-net
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  chapar-net:
    driver: bridge
